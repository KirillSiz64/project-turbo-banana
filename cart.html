<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Корзина — Банана</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- ШАПКА -->
  <header class="header">
    <div class="container header__inner">
      <a href="index.html" class="logo">
        <img src="img/logo.png" alt="Банана" class="logo__img">
      </a>
      <nav class="nav">
        <ul class="nav__list">
          <li><a href="index.html" class="nav__link">Главная</a></li>
          <li><a href="catalog.html" class="nav__link">Каталог</a></li>
          <li><a href="configurator.html" class="nav__link">Конфигуратор</a></li>
          <li><a href="contacts.html" class="nav__link">Контакты</a></li>
        </ul>
      </nav>
      <div class="header__search">
        <input type="text" placeholder="Поиск по товарам..." id="searchInput" class="search-input">
        <button class="search-btn" id="searchBtn">🔍</button>
      </div>
      <a href="cart.html" class="cart-link" id="cartLink">
        <span class="cart-icon">🛒</span>
        <span class="cart-count" id="cartCount">0</span>
      </a>
    </div>
  </header>

  <!-- СОДЕРЖИМОЕ КОРЗИНЫ -->
  <main class="cart-page">
    <div class="container">
      <!-- Заголовок страницы -->
      <h1 class="page-title">Корзина</h1>

      <!-- Блок, который показывается, если корзина пуста (изначально скрыт) -->
      <div id="cartEmptyMessage" class="cart-empty" style="display: none;">
        <p>🛒 Ваша корзина пуста.</p>
        <!-- Кнопка для перехода в каталог -->
        <a href="catalog.html" class="btn btn--primary">Перейти в каталог</a>
      </div>

      <!-- Основной блок корзины (таблица с товарами и итоги) -->
      <div id="cartContent">
        
        <!-- Таблица товаров в корзине -->
        <table class="cart-table">
          <thead>
            <tr>
              <th>Товар</th>        <!-- Название и изображение -->
              <th>Цена</th>          <!-- Цена за единицу -->
              <th>Количество</th>    <!-- Счётчик с кнопками +/- -->
              <th>Сумма</th>         <!-- Цена * количество -->
              <th></th>              <!-- Кнопка удаления -->
            </tr>
          </thead>
          <!-- Тело таблицы заполняется динамически через JS -->
          <tbody id="cartItemsContainer">
            <!-- Здесь будут строки с товарами -->
          </tbody>
        </table>

        <!-- Блок с итоговой суммой и кнопкой оформления -->
        <div class="cart-summary">
          <div class="cart-total">
            <span>Итого:</span>
            <!-- Сумма будет обновляться через JS -->
            <span id="cartTotalAmount">0 ₽</span>
          </div>
          <!-- Кнопка перехода к оформлению заказа -->
          <a href="checkout.html" class="btn btn--large btn--primary">Оформить заказ</a>
        </div>
        
      </div>
    </div>
  </main>

  <!-- ПОДВАЛ -->
  <footer class="footer">
    <div class="container footer__inner">
      <p>&copy; 2025 Банана. Все права защищены.</p>
      <p>ПИНЖ-13</p>
    </div>
  </footer>

  <!-- ПОДКЛЮЧЕНИЕ СКРИПТОВ -->
  <script src="js/main.js"></script>
  <script src="js/cart.js"></script>
  
  <!-- Вызов функции рендеринга корзины при загрузке -->
  <script>
    document.addEventListener('DOMContentLoaded', renderCart);
  </script>
</body>
</html>
